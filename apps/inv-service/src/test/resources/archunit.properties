# Catraca do ArchUnit (FreezingArchRule) — DEBT-ARCH-002 (Checkout -> Inventory)
# O store é versionado: violações conhecidas ficam registradas; novas violações quebram o build.
# Em CI a criação de store é proibida para impedir que alguém "congele" violações novas silenciosamente.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.refreeze=false

