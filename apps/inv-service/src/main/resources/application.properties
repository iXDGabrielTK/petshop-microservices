spring.application.name=inv-service
server.port=8083

# --- Banco de Dados ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Sao_Paulo'

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.postgresql.transactional-lock=false

# --- Monitoramento (Prometheus) ---
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.public.key=${JWT_PUBLIC_KEY:}

spring.threads.virtual.enabled=true
logging.config=classpath:logback-shared.xml
spring.jpa.open-in-view=false

# --- Otimizacoes de Batch ---
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Configuração do Redis ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=250ms

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
outbox.publisher.confirm-timeout-ms=${OUTBOX_PUBLISHER_CONFIRM_TIMEOUT_MS:3000}
inv.rabbitmq.legacy-low-stock-queue.enabled=${INV_RABBITMQ_LEGACY_LOW_STOCK_QUEUE_ENABLED:false}

# --- RabbitMQ configurações de retry e DLQ ---
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Projeção Diária do Finance (ADR-0006 estendida / DEBT-ARCH-001 E3) ---
finance.projection.diaria.enabled=true

# --- Cache Caffeine (DEBT-ARCH-001 E5 / Q5) ---
dashboard.cache.ttl=${DASHBOARD_CACHE_TTL:15s}
dashboard.cache.max-size=${DASHBOARD_CACHE_MAX_SIZE:100}

# --- Feature Flags (DEBT-ARCH-003 E3) ---
features.cancelamento-venda-concluida.enabled=${FEATURES_CANCELAMENTO_VENDA_CONCLUIDA_ENABLED:false}

# --- Agendamento e Resiliência da Outbox (DEBT-ARCH-006 E2) ---
inv.scheduling.enabled=${INV_SCHEDULING_ENABLED:true}
outbox.scheduler.enabled=${OUTBOX_SCHEDULER_ENABLED:true}
outbox.scheduler.fixed-delay-ms=${OUTBOX_SCHEDULER_FIXED_DELAY_MS:2000}
outbox.scheduler.initial-delay-ms=${OUTBOX_SCHEDULER_INITIAL_DELAY_MS:1000}
outbox.retry.max-attempts=${OUTBOX_RETRY_MAX_ATTEMPTS:5}
outbox.retry.base-delay-ms=${OUTBOX_RETRY_BASE_DELAY_MS:2000}
outbox.retry.max-delay-ms=${OUTBOX_RETRY_MAX_DELAY_MS:60000}
