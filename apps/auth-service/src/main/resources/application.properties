spring.application.name=auth-service
server.port=8081

# --- Conexao com Banco (Docker ou local) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.fail-on-missing-locations=true

springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.flywaydb=DEBUG

# --- JWT Config ---
jwt.private.key=${JWT_PRIVATE_KEY:}
jwt.public.key=${JWT_PUBLIC_KEY:}

# --- RabbitMQ ---
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}

# --- RabbitMQ configurações de retry e DLQ ---
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Actuator & Prometheus Monitoring ---
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}

# --- Frontend Integration ---
frontend.base-url=${FRONTEND_BASE_URL}
auth.oauth2.client.redirect-uris=${AUTH_OAUTH2_CLIENT_REDIRECT_URIS:${frontend.base-url}/authorized}

# --- CORS Config ---
cors.allowed-methods=${CORS_ALLOWED_METHODS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}

spring.threads.virtual.enabled=true
logging.config=classpath:logback-shared.xml
spring.jpa.open-in-view=false

# --- Segurança do Seed (Injeção de Dependência) ---
initial.admin.email=${INITIAL_ADMIN_EMAIL}
initial.admin.password=${INITIAL_ADMIN_PASSWORD}

# O Compose local sobrescreve Secure para permitir desenvolvimento com HTTP.
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=Lax

# --- Proteção contra Brute Force no /login ---
auth.login.lockout.max-attempts=${AUTH_LOGIN_LOCKOUT_MAX_ATTEMPTS:5}
auth.login.lockout.duration-minutes=${AUTH_LOGIN_LOCKOUT_DURATION_MINUTES:15}
auth.login.lockout.max-entries=${AUTH_LOGIN_LOCKOUT_MAX_ENTRIES:10000}

