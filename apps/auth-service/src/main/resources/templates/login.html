<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Malvadao Inc</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-layout">

    <div class="login-brand-panel">
        <div class="login-brand-header">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="login-brand-icon"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"></path></svg>
            Petshop Malvadao Inc
        </div>
        <div class="login-brand-quote-wrap">
            <blockquote class="login-brand-quote">
                <p>“Esse sistema mudou a forma como gerencio meus Animais. Simples, rápido e visualmente impecável.”</p>
                <footer>Sofia Davis</footer>
            </blockquote>
        </div>
    </div>

    <div class="login-form-panel">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Acesse sua conta</h1>
                <p class="login-subtitle">Entre com suas credenciais para continuar.</p>
            </div>

            <div>
                <form th:action="@{/login}" method="post">

                    <div th:if="${param.error}" class="login-error">
                        Email ou senha inválidos. Tente novamente.
                    </div>

                    <div class="login-fields">
                        <div class="login-field">
                            <label class="login-label" for="username">E-mail</label>
                            <input id="username" name="username" type="email" placeholder="admin@petshop.com" autocapitalize="none" autocomplete="email" autocorrect="off" class="login-input" required>
                        </div>
                        <div class="login-field">
                            <div class="login-label-row">
                                <label class="login-label" for="password">Senha</label>
                                <a href="http://localhost:5173/esqueci-senha" class="login-link-muted">
                                    Esqueceu a senha?
                                </a>
                            </div>
                            <input id="password" name="password" type="password" placeholder="******" autocomplete="current-password" class="login-input" required>
                        </div>
                        <button type="submit" class="login-submit">
                            Entrar
                        </button>
                    </div>
                </form>
            </div>

            <p class="login-footer">
                Não tem conta? <a href="http://localhost:5173/register" class="login-link-primary">Crie agora</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
