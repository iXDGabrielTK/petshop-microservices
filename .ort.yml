excludes:
  scopes:
    - pattern: "test"
      reason: "TEST_DEPENDENCY_OF"
      comment: "Dependências de teste não são empacotadas nas imagens de runtime."

license_choices:
  package_license_choices:
    - package_id: "Maven:com.rabbitmq:amqp-client:5.22.0"
      license_choices:
        - given: "Apache-2.0 OR GPL-2.0-only OR MPL-2.0"
          choice: "Apache-2.0"
        - given: "Apache-2.0 OR GPL-2.0-only OR MPL-1.1"
          choice: "Apache-2.0"
    - package_id: "Maven:org.yaml:snakeyaml:2.3"
      license_choices:
        - given: "EPL-1.0 OR LGPL-2.1-or-later OR GPL-2.0-or-later OR Apache-2.0 OR BSD-3-Clause"
          choice: "Apache-2.0"
    - package_id: "Maven:jakarta.persistence:jakarta.persistence-api:3.1.0"
      license_choices:
        - given: "BSD-3-Clause OR EPL-2.0"
          choice: "BSD-3-Clause"
    - package_id: "Maven:jakarta.annotation:jakarta.annotation-api:2.1.1"
      license_choices:
        - given: "EPL-2.0 OR GPL-2.0-only WITH Classpath-exception-2.0"
          choice: "EPL-2.0"
    - package_id: "Maven:jakarta.transaction:jakarta.transaction-api:2.0.1"
      license_choices:
        - given: "EPL-2.0 OR GPL-2.0-only WITH Classpath-exception-2.0"
