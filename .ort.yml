          choice: "Apache-2.0"
    - package_id: "Maven:org.eclipse.angus:jakarta.mail:2.0.5"
      license_choices:
        - given: "BSD-3-Clause OR EPL-2.0 OR GPL-2.0-only WITH Classpath-exception-2.0"
          choice: "EPL-2.0"
    - package_id: "Maven:ch.qos.logback:logback-classic:1.5.22"
      license_choices:
        - given: "EPL-1.0 OR LGPL-2.1-or-later"
          choice: "LGPL-2.1-or-later"
        - given: "EPL-1.0 OR LGPL-2.1-only"
          choice: "LGPL-2.1-only"
    - package_id: "Maven:ch.qos.logback:logback-core:1.5.22"
