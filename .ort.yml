        - given: "EPL-1.0 OR LGPL-2.1-or-later"
          choice: "LGPL-2.1-or-later"
        - given: "EPL-1.0 OR LGPL-2.1-only"
          choice: "LGPL-2.1-only"

package_configurations:
  - id: "Maven:org.antlr:antlr4-runtime:4.13.0"
    license_finding_curations:
      - path: "tool/resources/org/antlr/v4/tool/templates/codegen/TypeScript/TypeScript.stg"
        start_lines: "2"
        line_count: 1
        detected_license: "RPL-1.5"
        concluded_license: "NONE"
        reason: "INCORRECT"
        comment: "Detecção imprecisa (score 65.0) em template do gerador TypeScript upstream (módulo tool), ausente em antlr4-runtime-4.13.0.jar."
      - path: "tool/src/org/antlr/v4/codegen/target/TypeScriptTarget.java"
        start_lines: "3"
        line_count: 1
        detected_license: "RPL-1.5"
        concluded_license: "NONE"
        reason: "INCORRECT"
        comment: "Detecção imprecisa (score 65.0) no alvo do gerador TypeScript upstream (módulo tool), ausente em antlr4-runtime-4.13.0.jar."
