name: GHCR Container Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  cleanup-images:
    name: Clean Old Images (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, inv-service, mail-service]

    permissions:
      packages: write

    steps:
      - name: Apagar versões antigas e untagged
        uses: actions/delete-package-versions@v5
        with:
          package-name: '${{ github.event.repository.name }}/${{ matrix.service }}'
          package-type: 'container'
          min-versions-to-keep: 3
          delete-only-untagged-versions: true
