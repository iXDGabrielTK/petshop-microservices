name: CI/CD Pipeline - Petshop Microservices

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io

jobs:
  # --------------------------------------------------------
  # ETAPA 1: Linting e Validação do POM / XML
  # --------------------------------------------------------
  validate-code:
    name: 1. Validate & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Validar integridade de configuracao (bloquear caminhos do host)
        run: |
          if git grep -Eni '(<executable>|[a-z]:\\[a-z])' -- 'pom.xml' '**/pom.xml' 'Dockerfile' '**/Dockerfile' 'docker-compose*.yml' '**/docker-compose*.yml' '**/*.properties' '**/*.yml' '**/*.yaml' ':!.github/workflows/*'; then
            echo "::error::Caminho absoluto local do Windows ou tag <executable> detectado em arquivos de configuracao!"
            exit 1
          fi

      - name: Verificar ausencia da catraca ArchUnit (archunit_store)
        run: |
          if [ -d "apps/inv-service/src/test/resources/archunit_store" ] || [ -n "$(git ls-files '**/archunit_store/**')" ]; then
            echo "::error::Diretorio archunit_store detectado! A catraca FreezingArchRule foi removida definitivamente no DEBT-ARCH-002 (E5)."
            exit 1
          fi

      - name: Validar estrutura dos POMs
        run: mvn validate

      - name: Verificar conformidade de licencas e estilo (Spotless)
        run: mvn spotless:check

  # --------------------------------------------------------
  # ETAPA 2: Testes Unitários e de Integração
  # --------------------------------------------------------
  unit-tests:
    name: 2. Run Tests & Coverage
    needs: validate-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar testes unitários e de integração
        run: mvn clean verify

      - name: Validar relatórios Surefire e Failsafe
        run: python3 .github/scripts/check-test-reports.py

      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            apps/*/target/surefire-reports/TEST-*.xml
            apps/*/target/failsafe-reports/TEST-*.xml
            apps/*/target/failsafe-reports/failsafe-summary.xml

  # --------------------------------------------------------
  # ETAPA 3: Análise de Segurança (SAST / CVEs)
  # --------------------------------------------------------
  security-scan:
    name: 3. Security Vulnerability Scan
    needs: validate-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Varredura de Vulnerabilidades no Código (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: .trivyignore

  # --------------------------------------------------------
  # ETAPA 4: Build e Push das Imagens Docker (Em Matriz)
  # --------------------------------------------------------
  build-and-push-docker:
    name: 4. Build Docker (${{ matrix.service }})
    needs: [unit-tests, security-scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, inv-service, mail-service]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir Tags da Imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=git-
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build e Push da Imagem Docker
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validar inventario, licencas e metadados OCI
        env:
          SERVICE_NAME: ${{ matrix.service }}
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Valida o artefato deste build, sem resolver tags mutaveis como latest.
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            FULL_IMAGE="${IMAGE_NAME,,}@${IMAGE_DIGEST:?Digest do build ausente}"
            docker pull --platform linux/amd64 "$FULL_IMAGE"
          else
            FULL_IMAGE="${IMAGE_ID:?ID da imagem local ausente}"
            docker image inspect "$FULL_IMAGE" > /dev/null
          fi
          for file in LICENSE THIRD-PARTY-NOTICES.md; do
            docker run --rm --entrypoint test "$FULL_IMAGE" -s "/app/licenses/$file"
            docker run --rm --entrypoint cat "$FULL_IMAGE" "/app/licenses/$file" > "$RUNNER_TEMP/$file"
            cmp "$file" "$RUNNER_TEMP/$file"
            python3 -c 'import pathlib,sys; sys.exit(1 if b"\x00" in pathlib.Path(sys.argv[1]).read_bytes() else 0)' "$RUNNER_TEMP/$file"
          done
          docker run --rm --entrypoint cat "$FULL_IMAGE" /app/app.jar > "$RUNNER_TEMP/app.jar"
          python3 - "$SERVICE_NAME" "$RUNNER_TEMP/app.jar" THIRD-PARTY-NOTICES.md <<'PY'
          import pathlib, re, sys, zipfile
          svc, jar_path, notices_path = sys.argv[1], sys.argv[2], sys.argv[3]
          code = {"api-gateway": "G", "auth-service": "A", "inv-service": "I", "mail-service": "M"}[svc]
          text = pathlib.Path(notices_path).read_text(encoding="utf-8")
          rows = re.findall(r"^\| `[^:`]+:([^`]+\.jar)` \| `([^`]+)` \| ([^|]+) \| \[fontes\]\(https://[^)]+\) \|$", text, flags=re.M)
          if not rows:
              sys.exit("Tabela de inventario nao encontrada em THIRD-PARTY-NOTICES.md")
          expected = {jar for jar, _lic, imgs in rows if code in [x.strip() for x in imgs.split(",")]}
          with zipfile.ZipFile(jar_path) as zf:
              libs = [pathlib.PurePosixPath(p).name for p in zf.namelist() if p.startswith("BOOT-INF/lib/") and p.endswith(".jar")]
          if "common-lib-1.0-SNAPSHOT.jar" not in libs:
              sys.exit(f"common-lib ausente em BOOT-INF/lib de {svc}")
          actual = {j for j in libs if not j.startswith("common-lib-")}
          missing, extra = sorted(expected - actual), sorted(actual - expected)
          if missing or extra:
              sys.exit(f"Divergencia de inventario em {svc} ({code}): ausentes={missing}, nao_declarados={extra}")
          PY
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$FULL_IMAGE")" = 'AGPL-3.0-only'
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$FULL_IMAGE")" = "$EXPECTED_SOURCE"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$FULL_IMAGE")" = "$EXPECTED_REVISION"

