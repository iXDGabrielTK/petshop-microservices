version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/apps/api-gateway"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/auth-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/inv-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/mail-service"
    schedule:
      interval: "weekly"